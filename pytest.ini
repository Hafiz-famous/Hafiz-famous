[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    auth: Authentication tests
    timekeeping: Timekeeping tests
    leaves: Leave management tests
    dashboard: Dashboard tests
    slow: Slow running tests